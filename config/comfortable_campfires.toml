# Maximum distance from campfire
# default: 3
distance = 5
# Maximum duration of effect
# default: 5
duration = 5
# Amplifier of effect
# default: 0
amplifier = 0

# What effects should be applied
[effects]
	"minecraft:campfire" = "environmental:relief"
	"minecraft:soul_campfire" = "environmental:relief"
	"caverns_and_chasms:cupric_campfire" = "environmental:relief"
